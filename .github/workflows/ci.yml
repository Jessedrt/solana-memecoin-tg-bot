name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile bot.py serverless.py api/*.py

      - name: Render sample alert
        run: |
          python - <<'PY'
          import bot
          t = bot.Token(
              mint="11111111111111111111111111111111",
              name="Smoke Token",
              symbol="SMOKE",
              source="ci",
              usd_mcap=25000,
              price_usd=0.000025,
              created_ms=int(__import__("time").time() * 1000) - 300000,
              liquidity_usd=20000,
              volume_h1=12000,
              volume_m5=2500,
              price_change_h1=18,
              price_change_m5=6,
              buys_h1=42,
              sells_h1=20,
              buys_m5=12,
              sells_m5=5,
              rug_score=10,
              score=72,
              early_score=74,
              early_reasons=["buy velocity accelerating", "5m volume accelerating"],
          )
          rendered = bot.format_alert(t)
          assert "Exit check" in rendered
          assert "Why alerted" in rendered
          assert "SMOKE" in rendered

          # Regression: a late +1314% move with more sells than buys must
          # never pass the anti-chase momentum gate, regardless of RugCheck.
          late = bot.Token(
              mint="11111111111111111111111111111111",
              name="Late Pump",
              symbol="LATE",
              source="gecko-new",
              price_change_h1=1314,
              price_change_m5=34,
              buys_h1=472,
              sells_h1=543,
              rug_score=1,
          )
          assert not bot.momentum_not_extended(late)

          # Structural gate must fail closed when the full report is absent.
          assert not bot.structural_safety_ok(t)
          print(rendered)
          PY

      - name: Regression test scanner controls and executable math
        run: |
          python - <<'PY'
          import serverless

          # A $100 position at 5x must sell the full current position,
          # not estimate a $100 exit and multiply it by five.
          rec = {
              "entry_price": 1.0,
              "entry_mcap": 10000.0,
              "entry_liquidity": 2000.0,
          }
          snap = serverless._executable_snapshot(
              rec,
              current_mcap=50000.0,
              current_price=5.0,
              current_liquidity=2000.0,
              stake=100.0,
          )
          assert 450 < snap["marked_value"] < 460
          assert 3.0 < snap["multiple"] < 3.3
          assert snap["multiple"] < 5.0

          # An already queued scheduled delivery must be ignored when OFF.
          original_enabled = serverless.scanner_enabled
          serverless.scanner_enabled = lambda: False
          skipped = serverless.run_scan(require_durable_state=True, respect_enabled=True)
          assert skipped.get("disabled") == 1
          serverless.scanner_enabled = original_enabled

          # /off deletes both the configured schedule ID and any stale schedule
          # still targeting Pulse's production scan endpoint.
          class Resp:
              def __init__(self, status_code=200, payload=None):
                  self.status_code = status_code
                  self._payload = payload
              def raise_for_status(self):
                  if self.status_code >= 400:
                      raise RuntimeError(self.status_code)
              def json(self):
                  return self._payload

          deleted = []
          states = []
          old_token = serverless.QSTASH_TOKEN
          old_base = serverless.QSTASH_BASE_URL
          old_prod = serverless.production_base_url
          old_get = serverless.requests.get
          old_delete = serverless.requests.delete
          old_set = serverless.set_scanner_enabled
          try:
              serverless.QSTASH_TOKEN = "test-token"
              serverless.QSTASH_BASE_URL = "https://qstash.test"
              serverless.production_base_url = lambda: "https://pulse.test"
              serverless.requests.get = lambda *a, **k: Resp(200, [
                  {"scheduleId": "stale-schedule", "destination": "https://pulse.test/api/scan"}
              ])
              def fake_delete(url, **kwargs):
                  deleted.append(url)
                  return Resp(204, None)
              serverless.requests.delete = fake_delete
              serverless.set_scanner_enabled = lambda enabled: states.append(enabled)

              result = serverless.delete_qstash_schedule()
              assert result["disabled"] is True
              assert states == [False]
              assert any("solana-memecoin-scanner" in x for x in deleted)
              assert any("stale-schedule" in x for x in deleted)
          finally:
              serverless.QSTASH_TOKEN = old_token
              serverless.QSTASH_BASE_URL = old_base
              serverless.production_base_url = old_prod
              serverless.requests.get = old_get
              serverless.requests.delete = old_delete
              serverless.set_scanner_enabled = old_set
          PY
